name: Windows checks and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Check TypeScript
        run: pnpm check
      - name: Run frontend tests
        run: pnpm test
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Check Rust
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build frontend
        run: pnpm build

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: check
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release version
        shell: pwsh
        run: |
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          $version = [regex]::Match($cargo, '(?m)^version = "([^"]+)"').Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match the application version.' }
      - name: Build Windows installer
        run: pnpm release
      - name: Prepare assets and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory release-assets | Out-Null
          Copy-Item 'src-tauri/target/installer/release/bundle/nsis/*-setup.exe' release-assets/
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          Copy-Item "src-tauri/target/installer/release/$($config.mainBinaryName).exe" release-assets/
          Get-ChildItem release-assets/*.exe | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content release-assets/SHA256SUMS.txt -Encoding ascii
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $assets = (Get-ChildItem release-assets -File).FullName
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          $version = [regex]::Match($cargo, '(?m)^version = "([^"]+)"').Groups[1].Value
          $tag = "v$version"
          if ($env:GITHUB_REF -eq 'refs/heads/main') {
            if ($version -ne '1.0.0') { Write-Host 'Future releases require a version tag.'; exit 0 }
            gh release view $tag --json tagName 2>$null
            if ($LASTEXITCODE -eq 0) { Write-Host 'Version 1.00 is already published.'; exit 0 }
            gh release create $tag @assets --target $env:GITHUB_SHA --title 'Prompt Copilot 1.00' --notes-file RELEASE_NOTES.md
          } else {
            gh release create $tag @assets --verify-tag --title "Prompt Copilot $version" --notes-file RELEASE_NOTES.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
